<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle Financeiro</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <header>
      <h1><i class="fas fa-wallet"></i> Controle Financeiro</h1>
      <p>Acompanhe suas finanças mensais em tempo real</p>
    </header>

    <div class="dashboard">
      <div class="card">
        <div class="card-header">
          <div class="card-icon income-icon">
            <i class="fas fa-arrow-down"></i>
          </div>
          <div>
            <div class="card-title">Receitas</div>
            <div class="card-value income-value" id="totalIncome">R$ 0,00</div>
          </div>
        </div>
        <p>Total de entradas este mês</p>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="card-icon expense-icon">
            <i class="fas fa-arrow-up"></i>
          </div>
          <div>
            <div class="card-title">Despesas</div>
            <div class="card-value expense-value" id="totalExpenses">R$ 0,00</div>
          </div>
        </div>
        <p>Total de saídas este mês</p>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="card-icon balance-icon">
            <i class="fas fa-balance-scale"></i>
          </div>
          <div>
            <div class="card-title">Saldo</div>
            <div class="card-value balance-value" id="balance">R$ 0,00</div>
          </div>
        </div>
        <p>Saldo atual (Receitas - Despesas)</p>
      </div>
    </div>

    <div class="form-section">
      <h2 class="form-title"><i class="fas fa-plus-circle"></i> Adicionar Transação</h2>
      <form id="transactionForm" class="form-grid">
        <div class="form-group">
          <label for="description">Descrição</label>
          <input type="text" id="description" placeholder="Ex: Salário, Aluguel..." required>
        </div>
        <div class="form-group">
          <label for="amount">Valor (R$)</label>
          <input type="number" id="amount" step="0.01" min="0.01" placeholder="0,00" required>
        </div>
        <div class="form-group">
          <label for="type">Tipo</label>
          <select id="type" required>
            <option value="income">Receita (+)</option>
            <option value="expense">Despesa (-)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="date">Data</label>
          <input type="date" id="date" required>
        </div>
        <div class="form-group" style="grid-column: span 2;">
          <button type="submit" class="btn btn-primary">
            <i class="fas fa-save"></i> Adicionar Transação
          </button>
        </div>
      </form>
    </div>

    <div class="transactions-section">
      <h2 class="section-title"><i class="fas fa-exchange-alt"></i> Transações do Mês</h2>
      <div class="transactions-list" id="transactionsList">
        <div class="no-transactions">Nenhuma transação registrada ainda.</div>
      </div>
    </div>
  </div>

  <script>
    // Dados em memória (em um cenário real, isso seria persistido em um banco de dados)
    let transactions = JSON.parse(localStorage.getItem('transactions')) || [];

    // Elementos do DOM
    const transactionForm = document.getElementById('transactionForm');
    const transactionsList = document.getElementById('transactionsList');
    const totalIncomeEl = document.getElementById('totalIncome');
    const totalExpensesEl = document.getElementById('totalExpenses');
    const balanceEl = document.getElementById('balance');

    // Função para formatar moeda
    function formatCurrency(value) {
      return new Intl.NumberFormat('pt-BR', {
        style: 'currency',
        currency: 'BRL'
      }).format(value);
    }

    // Função para obter o primeiro e último dia do mês atual
    function getCurrentMonthRange() {
      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth();

      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);

      return { firstDay, lastDay };
    }

    // Função para filtrar transações do mês atual
    function getTransactionsThisMonth() {
      const { firstDay, lastDay } = getCurrentMonthRange();
      return transactions.filter(transaction => {
        const transactionDate = new Date(transaction.date);
        return transactionDate >= firstDay && transactionDate <= lastDay;
      });
    }

    // Função para calcular totais
    function calculateTotals() {
      const currentTransactions = getTransactionsThisMonth();
      let income = 0;
      let expenses = 0;

      currentTransactions.forEach(transaction => {
        if (transaction.type === 'income') {
          income += parseFloat(transaction.amount);
        } else {
          expenses += parseFloat(transaction.amount);
        }
      });

      const balance = income - expenses;

      return { income, expenses, balance };
    }

    // Função para atualizar o dashboard
    function updateDashboard() {
      const { income, expenses, balance } = calculateTotals();

      totalIncomeEl.textContent = formatCurrency(income);
      totalExpensesEl.textContent = formatCurrency(expenses);
      balanceEl.textContent = formatCurrency(balance);

      // Atualizar cor do saldo
      if (balance >= 0) {
        balanceEl.className = 'card-value balance-value';
      } else {
        balanceEl.className = 'card-value expense-value';
      }
    }

    // Função para renderizar transações
    function renderTransactions() {
      const currentTransactions = getTransactionsThisMonth();

      if (currentTransactions.length === 0) {
        transactionsList.innerHTML = '<div class="no-transactions">Nenhuma transação registrada ainda.</div>';
        return;
      }

      // Ordenar por data (mais recente primeiro)
      const sortedTransactions = currentTransactions.sort((a, b) =>
        new Date(b.date) - new Date(a.date)
      );

      transactionsList.innerHTML = sortedTransactions.map(transaction => {
        const date = new Date(transaction.date);
        const formattedDate = date.toLocaleDateString('pt-BR');
        const amountClass = transaction.type === 'income' ? 'income-amount' : 'expense-amount';
        const amountValue = transaction.type === 'income'
          ? formatCurrency(parseFloat(transaction.amount))
          : formatCurrency(parseFloat(transaction.amount));

        return `
                    <div class="transaction-item">
                        <div class="transaction-info">
                            <div class="transaction-name">${transaction.description}</div>
                            <div class="transaction-date">${formattedDate}</div>
                        </div>
                        <div class="transaction-amount ${amountClass}">${amountValue}</div>
                    </div>
                `;
      }).join('');
    }

    // Função para adicionar transação
    function addTransaction(e) {
      e.preventDefault();

      const description = document.getElementById('description').value;
      const amount = document.getElementById('amount').value;
      const type = document.getElementById('type').value;
      const date = document.getElementById('date').value;

      const newTransaction = {
        id: Date.now(),
        description,
        amount: parseFloat(amount),
        type,
        date
      };

      transactions.push(newTransaction);
      localStorage.setItem('transactions', JSON.stringify(transactions));

      // Resetar formulário
      transactionForm.reset();

      // Atualizar interface
      updateDashboard();
      renderTransactions();
    }

    // Inicialização
    function init() {
      // Definir data atual no campo de data
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('date').value = today;

      // Event listeners
      transactionForm.addEventListener('submit', addTransaction);

      // Renderizar inicial
      updateDashboard();
      renderTransactions();
    }

    // Iniciar aplicação
    init();
  </script>
</body>

</html>
